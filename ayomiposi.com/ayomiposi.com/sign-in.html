<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http: //www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link href="all-images/icon-images/icon.png" rel="shortcut icon" type="image-png" />
    <link href="styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>AYOMIPOSI | My First Web Project Login</title>
</head>


<body>
    <section class="auth-section">
        <div class="auth-background">

            <div class="form-container">
                <div class="form-wrapper">

                    <div class="top-text-wrapper">
                        <h1>EREN</h1>
                        <p>We are glad to see you again! </p>
                    </div>

                    <div class="form-content">
                        <input type="email" class="text-field" id="email" placeholder="Email or Username" />
                        <input type="password" class="text-field" id="password" placeholder="Password" />
                        <button class="btn" title="login">Login</button>
                    </div>
                    <div class="text-content">
                        <div class="top-text-wrapper">
                            <div class="top-text-container">
                                <p> Don't have an account?</p>
                            </div>

                            <a href="sign-up.html">
                                <span class="btn" title="Sign up">Sign up</span>
                            </a>
                        </div>
                        <div class="bottom-text-wrapper">
                            <a href="forgot-password.html">
                                <span class="btn" title="forgot password">Forgot password?</span>
                        </div>
                    </div>
                </div>
            </div>

    </section>


</body>

</html>
