<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="../../all-images/icon-images/icon.png" rel="shortcut icon" type="image/png" />
    <link href="../../styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="../../styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="../../styles/main.css" type="text/css" rel="stylesheet" />
    <title>Hostel | Super Admin Reset Password</title>
</head>
<body>
    <div class="student-portal-wrapper">
        <div class="student-portal-card">
            <div class="portal-form-pane">
                <div class="form-header">
                    <h1 class="login-heading">Reset Password</h1>
                    <p class="login-subtext">Create a strong new password for your administrator account</p>
                </div>

                <form class="portal-login-form" action="admin-sign-in.html" method="POST">
                    <div class="underline-field-group">
                        <label for="otp">Security Verification Code (OTP)</label>
                        <input type="text" name="otp" class="underline-input" id="otp" required />
                    </div>

                    <div class="underline-field-group">
                        <label for="newPassword">New Console Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" name="newPassword" class="underline-input" id="newPassword" required />
                        </div>
                    </div>

                    <div class="underline-field-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" name="confirmPassword" class="underline-input" id="confirmPassword" required />
                        </div>
                    </div>

                    <button type="submit" class="portal-login-btn">Save New Password &amp; Sign In</button>
                </form>

                <div class="signup-account-prompt">
                    <span>Back to login?</span>
                    <a href="admin-sign-in.html" class="signup-link-highlight">Admin Login</a>
                </div>
            </div>

            <div class="portal-hero-pane">
                <div class="school-hero-display">
                    <div class="school-logo-badge">
                        <img src="../../all-images/icon-images/logo.png" alt="School Logo" class="school-logo-image" />
                    </div>
                </div>

                <div class="portal-hero-text">
                    <h2 class="hero-portal-title">
                        <span class="title-bold">Super Admin</span> <span class="title-light">Console</span>
                    </h2>
                    <p class="hero-portal-subtitle">Institutional security &amp; administrative access control</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
