<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="../../all-images/icon-images/icon.png" rel="shortcut icon" type="image/png" />
    <link href="../../styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="../../styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="../../styles/main.css" type="text/css" rel="stylesheet" />
    <title>Hostel | Staff Reset Password</title>
</head>
<body>
    <div class="student-portal-wrapper">
        <div class="student-portal-card">
            <div class="portal-form-pane">
                <div class="form-header">
                    <h1 class="login-heading">Reset Password</h1>
                    <p class="login-subtext">Enter your reset OTP and new password</p>
                </div>

                <form class="portal-login-form" action="" method="POST">
                    <div class="underline-field-group">
                        <label for="resetOtp">Reset OTP</label>
                        <input type="text" name="resetOtp" class="underline-input" id="resetOtp" required />
                    </div>

                    <div class="underline-field-group">
                        <label for="password">New Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" name="password" class="underline-input" id="password" required />
                        </div>
                    </div>

                    <div class="underline-field-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" name="confirmPassword" class="underline-input" id="confirmPassword" required />
                        </div>
                    </div>

                    <button type="submit" class="portal-login-btn" id="loginBtn">Reset Password</button>
                </form>

                <div class="signup-account-prompt">
                    <span>Back to sign in?</span>
                    <a href="staff-sign-in.html" class="signup-link-highlight">Back to Sign In</a>
                </div>
            </div>

            <div class="portal-hero-pane">
                <div class="school-hero-display">
                    <div class="school-logo-badge">
                        <img src="../../all-images/icon-images/logo.png" alt="School Logo" class="school-logo-image" />
                    </div>
                </div>

                <div class="portal-hero-text">
                    <h2 class="hero-portal-title">
                        <span class="title-bold">Welcome</span> <span class="title-light">to Staff Portal</span>
                    </h2>
                    <p class="hero-portal-subtitle">Enter your reset OTP and new password</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
