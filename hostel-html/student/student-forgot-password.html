<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="../all-images/icon-images/icon.png" rel="shortcut icon" type="image/png" />
    <link href="../styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="../styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="../styles/main.css" type="text/css" rel="stylesheet" />
    <script src="../js/student-auth.js"></script>
    <title>Hostel | Student Forgot Password</title>
</head>
<body>
    <div class="alert-overlay" id="alert"></div>

    <div class="student-portal-wrapper">
        <div class="student-portal-card">
            <div class="portal-form-pane">
                <div class="form-header">
                    <h1 class="login-heading">Forgot Password</h1>
                    <p class="login-subtext">Enter your registered email address to receive your password reset OTP</p>
                </div>

                <form class="portal-login-form" action="" method="POST" onsubmit="event.preventDefault(); forgotPasswordHandle();">
                    <div class="underline-field-group">
                        <label for="emailAddress">Email Address</label>
                        <input type="email" name="emailAddress" class="underline-input" id="emailAddress" placeholder="Enter your registered email address" required autocomplete="email" />
                    </div>

                    <button type="submit" class="portal-login-btn" id="forgotPasswordBtnId" title="Proceed to Reset Password">Proceed to Reset Password</button>
                </form>

                <div class="signup-account-prompt">
                    <span>Remember your password?</span>
                    <a href="student-login.html" class="signup-link-highlight">Back to Login</a>
                </div>
            </div>

            <div class="portal-hero-pane">
                <div class="school-hero-display">
                    <div class="school-logo-badge">
                        <img src="../all-images/icon-images/logo.png" alt="School Logo" class="school-logo-image" />
                    </div>
                </div>

                <div class="portal-hero-text">
                    <h2 class="hero-portal-title">
                        <span class="title-bold">Welcome</span> <span class="title-light">to Student Portal</span>
                    </h2>
                    <p class="hero-portal-subtitle">Recover and secure your student portal account</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
