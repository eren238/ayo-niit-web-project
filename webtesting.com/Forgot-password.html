<!DOCTYPE html

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link href="all-images/icon-images/icon.png" rel="shortcut icon" type="image-png" />
    <link href="styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />

    <title>NIITITCORE | Sign in</title>

<body>
    <section class="auth-session">
        <div class="auth-background">
            <div class="overlay-bg">
                <div class="form-container">
                    <div class="form-content">

                        <div class="inner-form">

                            <div class="top-container">
                                <h2>Forgot Password</h2>
                                <div class="icon-container">
                                    <div class="icon">
                                        <i class="bi bi-facebook"></i>
                                    </div>
                                    <div class="icon">
                                        <i class="bi bi-twitter"></i>
                                    </div>

                                </div>
                            </div>
                            <div class="input-container">
                                <div class="input-wrapper">
                                    <label> Email Address<span>*</span></label>
                                    <input type="text" class="text-field" id="emailAddress"
                                        placeholder="Enter your email Adress" />
                                </div>
                                <a href="Reset-password.html">
                                

                                <button class="btn" title="Reset-password">Proceed to reset password</button>
                            </a>
                            </div>

                            

                        </div>

                        

                    </div>
                    <div class="form-content text-content">
                        <div class="text-wrapper">
                            <div class="logo-container">
                                <img src="all-images/icon-images/niit-logo.png" alt="niit-logo">
                            </div>
                            <div class="title">
                                <h1>Welcome to Student portal</h1>
                                <p> Already have an account?</p>
                            </div>

                       <a href="sign-up.html"> <button class="btn"title="sign-up">Sign-in</button></a>

                        </div>

                    </div>
                </div>


            </div>

        </div>
    </section>
