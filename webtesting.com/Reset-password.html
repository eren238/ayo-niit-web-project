<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http: //www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link href="all-images/icon-images/icon.png" rel="shortcut icon" type="image-png" />
    <link href="styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>NIITITCORE | Reset Password</title>
</head>

<body>
    <section class="auth-session">
        <div class="auth-background">
            <div class="overlay-bg">
                <div class="form-container">
                    <div class="form-content">

                        <div class="inner-form">

                            <div class="top-container">
                                <h2>Reset Password</h2>
                                <div class="icon-container">
                                    <div class="icon">
                                        <i class="bi bi-facebook"></i>
                                    </div>
                                    <div class="icon">
                                        <i class="bi bi-twitter"></i>
                                    </div>

                                </div>
                            </div>
                            <div class="alert-success">
                                👋 <span class="alert-highlight">POSI</span> an OTP has been sent to your <span class="alert-highlight">emailAddress</span> reset your password
                            </div>
                        <div class="input-container">
                            <div class="input-wrapper">
                                    <label> OTP <span>*</span></label>
                                    <input type="number" class="text-field" id="OTP"
                                        placeholder="Enter your OTP" />
                                </div>

                                <div class="input-wrapper">
                                    <label> New Password <span>*</span></label>
                                    <input type="password" class="text-field" id="newpassword"
                                    placeholder="Enter New Password" />
                                </div>
                                <div class="alert-warning">
                                    <i>At least 8 characters required including upper & lower class and special characters and numbers</i>
                                </div>
                                    <div class="input-wrapper">
                                        <label> CONFIRM PASSWORD: <span>*</span></label>
                                        <input type="password" class="text-field" id="confirmpassword" placeholder="Enter your Confirmed Password">
                                    </div>
                                
                                
                                

                                <button class="btn" title="Submit">Submit</button>
                                </div>
                             </div>  
                                  

                            

                                

                                
                            

                        

                        

                    </div>

                    <div class="form-content text-content">
                        <div class="text-wrapper">

                            <div class="logo-container">
                                <img src="all-images/icon-images/niit-logo.png" alt="niit-logo">
                            </div>
                            <div class="title">
                                <h1>Welcome to Student Portal</h1>
                                <p> Already have an account?</p>
                            </div>

                       <a href="sign-in.html"> <button class="btn"title="sign-up">Sign-in</button></a>

                        </div>

                    </div>
                    
                </div>


            </div>


        </div>
    </div>
    </section>


</body>

</html>
